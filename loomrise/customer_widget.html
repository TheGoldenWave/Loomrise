<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" href="data:,">
  <title>课程咨询</title>
  <style>
    :root { color-scheme: light; font: 15px/1.5 system-ui, sans-serif; color: #21332f; background: #f4f7f5; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; }
    main { width: min(100%, 520px); height: min(720px, calc(100vh - 32px)); display: flex; flex-direction: column; background: white; border: 1px solid #d7e0dc; border-radius: 8px; overflow: hidden; }
    header { padding: 16px 20px; border-bottom: 1px solid #e1e8e5; display: flex; align-items: center; justify-content: space-between; }
    h1 { margin: 0; font-size: 17px; font-weight: 650; }
    #status { color: #536b65; font-size: 13px; }
    #messages { flex: 1; overflow: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
    .message { max-width: 84%; white-space: pre-wrap; overflow-wrap: anywhere; padding: 10px 12px; border-radius: 8px; background: #eef3f1; }
    .visitor { align-self: flex-end; background: #dcefe8; }
    .operator { align-self: flex-start; border: 1px solid #e0e6e3; background: white; }
    .assistant { align-self: flex-start; background: #f2eee1; }
    .attachment { margin-top: 8px; padding: 6px 9px; border: 1px solid #9eb9af; border-radius: 4px; background: white; color: #176b55; font: inherit; cursor: pointer; }
    form { border-top: 1px solid #e1e8e5; padding: 12px; display: grid; grid-template-columns: 1fr auto; gap: 8px; }
    textarea { grid-column: 1 / -1; width: 100%; min-height: 78px; resize: vertical; border: 1px solid #bac9c3; border-radius: 5px; padding: 10px; font: inherit; }
    label { align-self: center; color: #435b55; font-size: 13px; }
    button { min-height: 40px; border: 0; border-radius: 5px; padding: 0 16px; color: white; background: #176b55; font: inherit; cursor: pointer; }
    button:focus-visible, textarea:focus-visible { outline: 3px solid #d79840; outline-offset: 2px; }
    button:disabled { opacity: .55; cursor: wait; }
    @media (max-width: 480px) { body { padding: 0; } main { height: 100vh; border: 0; border-radius: 0; } }
  </style>
</head>
<body data-agent-id="__AGENT_ID__" data-entry-id="__ENTRY_ID__">
  <main aria-label="课程咨询">
    <header><h1>课程咨询</h1><span id="status" role="status">正在连接</span></header>
    <section id="messages" aria-live="polite" aria-label="对话记录"></section>
    <form id="form">
      <textarea id="text" maxlength="20000" placeholder="输入您的问题" required aria-label="咨询内容"></textarea>
      <label><input id="handoff" type="checkbox"> 请人工客服协助</label>
      <button id="send" type="submit">发送</button>
    </form>
  </main>
  <script>
    const agentId = document.body.dataset.agentId;
    const entryId = document.body.dataset.entryId;
    const status = document.querySelector('#status');
    const messages = document.querySelector('#messages');
    const form = document.querySelector('#form');
    const send = document.querySelector('#send');
    const sessionKey = `loomrise:${agentId}:${entryId}`;
    let session = null;
    async function call(action, payload) {
      const response = await fetch('/api/customer-service', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action, payload }), cache: 'no-store'
      });
      const body = await response.json();
      if (!response.ok || !body.ok) throw new Error(body.error?.message || '请求失败');
      return body.result;
    }
    function draw(items) {
      messages.replaceChildren(...items.map(item => {
        const node = document.createElement('div');
        node.className = `message ${item.sender}`;
        node.textContent = item.text;
        if (item.asset_id && item.asset_version_id) {
          const attachment = document.createElement('button');
          attachment.className = 'attachment'; attachment.type = 'button';
          attachment.textContent = '下载附件';
          attachment.onclick = async () => {
            attachment.disabled = true;
            try {
              const file = await call('widget.material.download', {
                conversation_id: session.conversation_id, visitor_token: session.visitor_token,
                asset_id: item.asset_id, version_id: item.asset_version_id
              });
              const binary = atob(file.content_base64);
              const bytes = Uint8Array.from(binary, character => character.charCodeAt(0));
              const objectUrl = URL.createObjectURL(new Blob([bytes], { type: file.media_type }));
              const link = document.createElement('a');
              link.href = objectUrl; link.download = file.filename; link.click();
              setTimeout(() => URL.revokeObjectURL(objectUrl), 30000);
            } catch (error) { status.textContent = error.message; }
            finally { attachment.disabled = false; }
          };
          node.append(document.createElement('br'), attachment);
        }
        return node;
      }));
      messages.scrollTop = messages.scrollHeight;
    }
    async function refresh() {
      if (!session) return;
      const result = await call('widget.messages', {
        conversation_id: session.conversation_id, visitor_token: session.visitor_token
      });
      draw(result.items);
    }
    async function start() {
      try {
        session = JSON.parse(sessionStorage.getItem(sessionKey) || 'null');
        if (session) {
          try { await refresh(); }
          catch { session = null; sessionStorage.removeItem(sessionKey); }
        }
        if (!session) {
          session = await call('widget.open', { agent_id: agentId, entry_id: entryId });
          sessionStorage.setItem(sessionKey, JSON.stringify(session));
        }
        status.textContent = '已连接';
        await refresh();
      } catch (error) { status.textContent = error.message; send.disabled = true; }
    }
    form.addEventListener('submit', async event => {
      event.preventDefault();
      const text = document.querySelector('#text').value.trim();
      if (!session || !text) return;
      send.disabled = true;
      try {
        await call('widget.send', {
          conversation_id: session.conversation_id, visitor_token: session.visitor_token,
          text, request_human: document.querySelector('#handoff').checked
        });
        document.querySelector('#text').value = '';
        if (document.querySelector('#handoff').checked) status.textContent = '已请求人工客服';
        await refresh();
      } catch (error) { status.textContent = error.message; }
      finally { send.disabled = false; }
    });
    start();
    setInterval(() => refresh().catch(() => {}), 2500);
  </script>
</body>
</html>
