<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loomrise · 课程咨询</title>
  <style>
    :root { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #222a2c; background: #f4f6f4; }
    * { box-sizing: border-box; letter-spacing: 0; }
    body { margin: 0; }
    button, textarea { font: inherit; }
    button { cursor: pointer; border-radius: 5px; border: 1px solid #bac5c3; background: white; color: #263839; min-height: 44px; padding: 7px 13px; }
    button:hover:not(:disabled) { background: #eaf2ef; }
    button:disabled { opacity: .45; cursor: not-allowed; }
    button:focus-visible, textarea:focus-visible { outline: 2px solid #007f83; outline-offset: 2px; }
    .primary { background: #116c69; border-color: #116c69; color: white; }
    .primary:hover:not(:disabled) { background: #0b5654; }
    .danger { color: #a14233; border-color: #d6a99f; }
    header { height: 64px; border-bottom: 1px solid #d5ddda; background: #fff; display: flex; justify-content: space-between; align-items: center; padding: 0 max(20px, calc((100vw - 1240px)/2)); gap: 12px; }
    h1 { font-size: 19px; margin: 0; font-weight: 680; }
    .tag { font-size: 12px; border: 1px solid #b6c5c1; padding: 4px 8px; border-radius: 3px; white-space: nowrap; }
    main { max-width: 1240px; margin: auto; min-height: calc(100dvh - 64px); display: grid; grid-template-columns: minmax(0, 1fr) 270px; }
    .work { display: flex; flex-direction: column; min-width: 0; min-height: calc(100dvh - 64px); }
    .headline { padding: 24px 26px 18px; border-bottom: 1px solid #d5ddda; }
    h2 { margin: 0 0 6px; font-size: 18px; }
    .muted { color: #62716f; font-size: 13px; }
    .transcript { flex: 1; padding: 24px 26px; overflow: auto; display: flex; flex-direction: column; gap: 16px; }
    .message { max-width: min(670px, 95%); padding: 13px 16px; line-height: 1.62; white-space: pre-wrap; overflow-wrap: anywhere; border: 1px solid #cbd6d2; background: white; border-radius: 5px; }
    .message.user { align-self: flex-end; background: #e7f1ed; border-color: #b7d2c9; }
    .message.error { border-color: #d6a99f; color: #963b31; }
    .speaker { font-size: 11px; font-weight: 700; color: #60726d; margin-bottom: 5px; }
    .confirm { border-left: 3px solid #bb823d; padding: 12px 15px; background: #fff; max-width: 670px; line-height: 1.5; }
    .confirm strong { display: block; margin-bottom: 6px; }
    .confirm .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .composer { border-top: 1px solid #d5ddda; padding: 16px 26px 24px; background: #fff; }
    textarea { width: 100%; min-height: 75px; padding: 10px 12px; border: 1px solid #aebfba; border-radius: 5px; resize: vertical; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 9px; }
    .toolbar .spacer { flex: 1; }
    #status { font-size: 12px; color: #53716c; min-height: 20px; margin-top: 8px; }
    aside { border-left: 1px solid #d5ddda; padding: 24px 18px; background: #f9faf9; }
    aside h3 { margin: 0 0 16px; font-size: 13px; }
    dl { margin: 0; font-size: 12px; }
    dt { color: #5e6f6b; margin-top: 16px; }
    dd { margin: 4px 0 0; font-family: ui-monospace, Menlo, monospace; overflow-wrap: anywhere; }
    #events { margin-top: 25px; font-size: 11px; color: #586b65; max-height: 38vh; overflow: auto; }
    #events div { padding: 7px 0; border-top: 1px solid #e0e6e3; }
    @media (max-width: 720px) { header { padding: 0 16px; } main { display: block; } .work { min-height: 78dvh; } aside { border-left: 0; border-top: 1px solid #d5ddda; } .headline, .transcript, .composer { padding-left: 16px; padding-right: 16px; } .transcript { min-height: 32dvh; } }
  </style>
</head>
<body>
<header><h1>Loomrise <span class="muted">/ 课程咨询</span></h1><span class="tag">虚构课程 · 模拟预约</span></header>
<main>
  <section class="work" aria-label="咨询对话">
    <div class="headline"><h2>课程咨询</h2><span class="muted">数据分析入门 · 网页文字与语音</span></div>
    <div id="transcript" class="transcript" role="log" aria-live="polite"></div>
    <div class="composer">
      <label for="input" class="muted">消息</label>
      <textarea id="input" placeholder="输入课程问题或预约需求"></textarea>
      <div class="toolbar">
        <button id="record" title="开始或停止中文语音识别">录音</button>
        <button id="stop-audio" title="打断当前播报" disabled>打断播报</button>
        <button id="cancel" class="danger" disabled>取消执行</button>
        <span class="spacer"></span><button id="send" class="primary">发送</button>
      </div>
      <div id="status" role="status"></div>
    </div>
  </section>
  <aside aria-label="运行信息">
    <h3>当前请求</h3>
    <dl><dt>状态</dt><dd id="state">等待输入</dd><dt>请求 ID</dt><dd id="request-id">—</dd><dt>版本</dt><dd id="version">—</dd><dt>结果 ID</dt><dd id="result-id">—</dd></dl>
    <div id="events" aria-label="运行事件"></div>
  </aside>
</main>
<script>
const $ = id => document.getElementById(id);
let requestId = null, runId = null, busy = false;
const status = text => { $('status').textContent = text; };
function message(kind, text) {
  const item = document.createElement('div'); item.className = `message ${kind}`;
  const label = document.createElement('div'); label.className = 'speaker'; label.textContent = kind === 'user' ? '你' : 'Loomrise';
  const body = document.createElement('div'); body.textContent = text;
  item.append(label, body); $('transcript').append(item); item.scrollIntoView({block: 'end'});
  return body;
}
function logEvent(type) {
  const line = document.createElement('div'); line.textContent = type;
  $('events').prepend(line); while ($('events').children.length > 24) $('events').lastChild.remove();
}
async function post(path, data) {
  const response = await fetch(`/api/${path}`, {method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(data)});
  if (!response.ok) throw new Error((await response.text()).slice(0, 160));
  return response.json();
}
/* ---------- 语音通道：麦克风 PCM 上行，服务端合成 PCM 下行 ----------
   业务执行仍走 POST /api/runs；这里只管声音怎么进出浏览器。
   量到的停止时延是"停止指令 → AudioBufferSource 停止"，**不含扬声器与系统混音缓冲**，
   与声学级实测不是同一个数，记录时必须分开写。 */
const now = () => performance.now();
// 浏览器可能永远不回 getUserMedia（用户既不点允许也不点拒绝）——必须有超时，
// 否则按钮会停在"录音"且没有任何提示，用户以为坏了。
const withTimeout = (promise, ms, message) =>
  Promise.race([promise, new Promise((_, reject) => setTimeout(() => reject(new Error(message)), ms))]);
let voiceReady = false, ws = null, wsOpen = null, recording = false;
let audioCtx = null, playGain = null, micNode = null, micStream = null, playCursor = 0, micFirstFrameAt = 0;
let asrText = '', asrTimer = null;
const TURN_SILENCE_MS = 1200;   // 服务端已判句尾后再等这么久，区分"逗号停顿"与"说完了"
const playing = new Set();
let tts = null;
const voiceSend = payload => { if (ws && ws.readyState === 1) ws.send(JSON.stringify(payload)); };
function metric(name, value) { voiceSend({type: 'metric', name, value}); }

const MIC_WORKLET = `
class LoomriseMic extends AudioWorkletProcessor {
  constructor(options) {
    super();
    this.ratio = sampleRate / (options.processorOptions.targetRate || 16000);
    this.pos = 0; this.buf = [];
  }
  process(inputs) {
    const ch = inputs[0] && inputs[0][0];
    if (!ch) return true;
    while (this.pos < ch.length) {
      const i = Math.floor(this.pos), f = this.pos - i;
      const a = ch[i] || 0, b = ch[i + 1] === undefined ? a : ch[i + 1];
      this.buf.push(a + (b - a) * f);
      this.pos += this.ratio;
    }
    this.pos -= ch.length;
    while (this.buf.length >= 1600) {          // 100 ms @ 16 kHz
      const block = this.buf.splice(0, 1600), pcm = new Int16Array(1600);
      for (let i = 0; i < 1600; i++) {
        const s = Math.max(-1, Math.min(1, block[i]));
        pcm[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
      }
      this.port.postMessage(pcm.buffer, [pcm.buffer]);
    }
    return true;
  }
}
registerProcessor('loomrise-mic', LoomriseMic);
`;

function stopPlayback(interrupt) {
  const snapshot = tts;
  for (const src of playing) { try { src.stop(); } catch (_) {} }
  playing.clear(); playCursor = 0; $('stop-audio').disabled = true;
  if (!snapshot || snapshot.closed) return;
  snapshot.closed = true;
  if (snapshot.firstPlayAt) metric('playback.stopped', {stop_ms: Math.round(now() - (snapshot.interruptAt || now()))});
  if (interrupt && snapshot.fragmentId) {
    post('playback', {action: 'interrupted', request_id: requestId, run_id: snapshot.runId, fragment_id: snapshot.fragmentId}).catch(() => {});
  }
  tts = null;
  status(interrupt ? '播报已打断' : '播报结束');
}

async function finishPlayback() {
  const snapshot = tts;
  if (!snapshot || snapshot.closed || playing.size || !snapshot.doneAt) return;
  snapshot.closed = true;
  try {
    const id = snapshot.fragmentId || (snapshot.fragment ? await snapshot.fragment : null);
    if (id) await post('playback', {action: 'finished', request_id: requestId, run_id: snapshot.runId, fragment_id: id});
    status('播报完成（服务端合成）');
  } catch { status('播报结束，回执未确认'); }
  if (tts === snapshot) tts = null;
}

function playPcm(int16) {
  if (!audioCtx || !tts || !int16.length) return;
  const buffer = audioCtx.createBuffer(1, int16.length, 16000);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < int16.length; i++) data[i] = int16[i] / 32768;
  const src = audioCtx.createBufferSource();
  src.buffer = buffer; src.connect(playGain);
  if (playCursor < audioCtx.currentTime + 0.02) playCursor = audioCtx.currentTime + 0.02;
  src.start(playCursor); playCursor += buffer.duration;
  playing.add(src);
  src.onended = () => { playing.delete(src); if (!playing.size) finishPlayback(); };
  if (!tts.firstPlayAt) {
    tts.firstPlayAt = now();
    metric('playback.first_audio', {after_tts_request_ms: Math.round(tts.firstPlayAt - tts.speakAt)});
    // 回执口径不变：浏览器开始播出才报 started，播出结束才报 finished。
    tts.fragment = post('playback', {action: 'started', request_id: requestId, run_id: tts.runId, text: tts.text})
      .then(d => (tts.fragmentId = d.fragment_id)).catch(() => null);
  }
}

function speak(text, currentRun) {
  if (!text || !voiceReady) return;
  stopPlayback(true);
  tts = {text, runId: currentRun, speakAt: now(), interruptAt: 0, firstPlayAt: 0, doneAt: 0,
         fragmentId: null, fragment: null, closed: false};
  voiceSend({type: 'tts.speak', text, run_id: currentRun});
  status('正在合成播报（服务端）');
}

function stopSpeech() {
  if (tts) tts.interruptAt = now();
  if (tts && !tts.closed) voiceSend({type: 'tts.cancel', reason: 'barge_in'});
  stopPlayback(true);
}
async function confirmCard(value) {
  const card = document.createElement('div'); card.className = 'confirm';
  const title = document.createElement('strong'); title.textContent = '确认模拟预约？'; card.append(title);
  const args = value.tool_calls?.[0]?.arguments || {};
  const detail = document.createElement('div'); detail.textContent = `${args.course_id || '课程'} · ${args.learner_name || '学员'} · ${args.slot || '时段'}`; card.append(detail);
  const actions = document.createElement('div'); actions.className = 'actions';
  for (const [label, yes] of [['确认', true], ['拒绝', false]]) {
    const button = document.createElement('button'); button.textContent = label;
    if (yes) button.className = 'primary';
    button.onclick = async () => {
      for (const b of actions.children) b.disabled = true;
      try {
        await post('confirm', {request_id:requestId, confirmed:yes});
        actions.replaceWith(document.createTextNode(yes ? '已确认，等待执行结果。' : '已拒绝，等待执行结果。'));
        status(yes ? '已确认，继续执行' : '已拒绝');
      } catch (err) {
        for (const b of actions.children) b.disabled = false;
        status(`确认未提交：${err.message}。请重试。`);
      }
    };
    actions.append(button);
  }
  card.append(actions); $('transcript').append(card); card.scrollIntoView({block:'end'});
}
async function submit(text, channel='text') {
  text = text.trim(); if (!text || busy) return;
  stopSpeech(); busy = true; $('send').disabled = true; $('record').disabled = true; $('cancel').disabled = false;
  $('input').value = ''; message('user', text); status('正在执行'); $('state').textContent = '运行中';
  let reply = null, finalText = '', finished = false;
  function receive(evt) {
    logEvent(evt.type === 'CUSTOM' ? evt.name : evt.type);
    if (evt.type === 'RUN_STARTED') { requestId = evt.threadId; runId = evt.runId; $('request-id').textContent = requestId; }
    if (evt.type === 'TEXT_MESSAGE_CONTENT') { if (!reply) reply = message('assistant', ''); reply.textContent += evt.delta; }
    if (evt.type === 'CUSTOM' && evt.name === 'loomrise.require_user_confirm') { $('state').textContent = '等待确认'; confirmCard(evt.value); }
    if (evt.type === 'CUSTOM' && evt.name === 'loomrise.summary') {
      const v = evt.value; requestId = v.request_id; runId = v.run_id; finalText = v.text || '';
      $('version').textContent = v.version; $('state').textContent = v.state;
      $('result-id').textContent = v.result_id || '—';
      if (finalText && !reply) reply = message('assistant', finalText);
      if (channel === 'voice' && finalText) speak(finalText, runId);
      finished = true;
    }
    if (evt.type === 'RUN_ERROR') { if (evt.message !== 'request_state=failed') message('error', evt.message); $('state').textContent = '失败'; }
  }
  try {
    const response = await fetch('/api/runs', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({text, channel, request_id:requestId})});
    if (!response.ok) throw new Error((await response.text()).slice(0,160));
    const reader = response.body.getReader(), decoder = new TextDecoder(); let buffer = '';
    while (true) {
      const {done, value} = await reader.read(); if (done) break;
      buffer += decoder.decode(value, {stream:true}); let boundary;
      while ((boundary = buffer.indexOf('\n\n')) >= 0) {
        const frame = buffer.slice(0,boundary); buffer = buffer.slice(boundary+2);
        const data = frame.split('\n').filter(line => line.startsWith('data: ')).map(line => line.slice(6)).join('\n');
        if (data) receive(JSON.parse(data));
      }
    }
    if (!finished) status('连接结束，未收到完成回执');
    else if (!tts) status('执行完成');
  } catch (err) { message('error', err.message); $('input').value = text; status('请求失败，输入已保留，可重试'); $('state').textContent = '失败'; }
  finally { busy = false; $('send').disabled = false; $('record').disabled = false; $('cancel').disabled = true; }
}
function ensureVoice() {
  if (ws && ws.readyState === 1 && voiceReady) return Promise.resolve();
  if (wsOpen) return wsOpen;
  wsOpen = new Promise((resolve, reject) => {
    let settled = false;
    const socket = new WebSocket(`ws://${location.host}/ws/voice`);
    socket.binaryType = 'arraybuffer';
    const timer = setTimeout(() => { if (!settled) { settled = true; reject(new Error('语音通道超时')); } }, 6000);
    socket.onopen = () => { ws = socket; };
    socket.onmessage = event => {
      if (typeof event.data === 'string') {
        const evt = JSON.parse(event.data);
        if (evt.type === 'ready') { voiceReady = true; settled = true; clearTimeout(timer); resolve(); }
        if (evt.type === 'error' && !settled) { settled = true; clearTimeout(timer); reject(new Error(evt.message || evt.code)); }
        handleVoiceEvent(evt);
      } else if (event.data instanceof ArrayBuffer) {
        playPcm(new Int16Array(event.data));
      }
    };
    socket.onerror = () => { if (!settled) { settled = true; clearTimeout(timer); reject(new Error('语音通道连接失败')); } };
    socket.onclose = () => { ws = null; wsOpen = null; voiceReady = false; stopRecording(false); };
  });
  return wsOpen;
}

function handleVoiceEvent(evt) {
  if (evt.type === 'asr.ready') { asrText = ''; status('正在听取（服务端识别）'); return; }
  if (evt.type === 'asr.partial') {
    // 用户还在说：撤掉待发的自动结束，避免把半句话提交出去。
    clearTimeout(asrTimer); asrTimer = null;
    $('input').value = asrText + evt.text;
    return;
  }
  if (evt.type === 'asr.final') {
    asrText += evt.text || '';
    $('input').value = asrText;
    metric('asr.sentence', {chars: (evt.text || '').length, end_ms: evt.end_ms, index: evt.index});
    clearTimeout(asrTimer);
    asrTimer = setTimeout(() => { asrTimer = null; if (recording) stopRecording(); }, TURN_SILENCE_MS);
    return;
  }
  if (evt.type === 'asr.closed') {
    // 唯一的提交点：服务端已收尾，文本才完整。
    clearTimeout(asrTimer); asrTimer = null;
    metric('asr.closed', {sentences: evt.sentences, dropped_bytes: evt.dropped_bytes});
    const text = asrText.trim(); asrText = '';
    if (text) { $('input').value = text; submit(text, 'voice'); }
    else status(evt.dropped_bytes ? '上行积压，已丢弃部分音频' : '没有听清，请再说一次');
    return;
  }
  if (evt.type === 'tts.done') {
    if (tts) tts.doneAt = now();
    finishPlayback();
    return;
  }
  if (evt.type === 'tts.cancelled' || evt.type === 'tts.started' || evt.type === 'tts.first_audio') return;
  if (evt.type === 'error') status(`语音通道：${evt.message || evt.code}`);
}

async function startRecording() {
  if (recording) return;
  $('record').disabled = true;
  try {
    await ensureVoice();
    if (!audioCtx) {
      try { audioCtx = new AudioContext({sampleRate: 16000}); }
      catch (_) { audioCtx = new AudioContext(); }
      playGain = audioCtx.createGain();
      playGain.connect(audioCtx.destination);
    }
    if (audioCtx.state === 'suspended') await audioCtx.resume();
    stopSpeech();
    status('等待麦克风授权…');
    micStream = await withTimeout(
      navigator.mediaDevices.getUserMedia({
        audio: {channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true},
      }),
      15000, '麦克风授权超时（15 秒）：检查浏览器地址栏的麦克风权限');
    const moduleUrl = URL.createObjectURL(new Blob([MIC_WORKLET], {type: 'application/javascript'}));
    await withTimeout(audioCtx.audioWorklet.addModule(moduleUrl), 8000, '音频处理模块加载超时');
    URL.revokeObjectURL(moduleUrl);
    const source = audioCtx.createMediaStreamSource(micStream);
    micNode = new AudioWorkletNode(audioCtx, 'loomrise-mic', {processorOptions: {targetRate: 16000}});
    micNode.port.onmessage = event => {
      if (!recording || !ws || ws.readyState !== 1) return;
      ws.send(event.data);
      if (!micFirstFrameAt) {
        micFirstFrameAt = now();
        metric('mic.first_frame', {ctx_rate: audioCtx.sampleRate});
      }
    };
    const mute = audioCtx.createGain(); mute.gain.value = 0;   // 不回放自己，避免啸叫
    source.connect(micNode); micNode.connect(mute); mute.connect(audioCtx.destination);
    voiceSend({type: 'asr.start'});
    recording = true; micFirstFrameAt = 0; $('record').disabled = false;
    $('record').textContent = '停止录音'; $('record').classList.add('primary');
    status('正在听取（服务端识别）');
  } catch (err) {
    $('record').disabled = false;
    stopRecording(false);
    status(`录音未启动：${err.message}`);
  }
}

function stopRecording(sendStop) {
  if (micNode) { try { micNode.disconnect(); } catch (_) {} micNode = null; }
  if (micStream) { micStream.getTracks().forEach(track => track.stop()); micStream = null; }
  if (recording && sendStop !== false) voiceSend({type: 'asr.stop'});
  recording = false; $('record').disabled = false;
  $('record').textContent = '录音'; $('record').classList.remove('primary');
}
$('record').onclick = () => { if (recording) stopRecording(); else startRecording(); };
$('stop-audio').onclick = stopSpeech;
$('send').onclick = () => submit($('input').value);
$('cancel').onclick = async () => { if (requestId && runId) { try { await post('cancel', {request_id:requestId, run_id:runId}); status('取消请求已发送，等待执行端确认'); } catch (err) { status(err.message); } } };
$('input').onkeydown = event => { if (event.key === 'Enter' && !event.shiftKey && !event.isComposing) { event.preventDefault(); submit($('input').value); } };
fetch('/api/status').then(r => { if (!r.ok) throw new Error(); return r.json(); }).then(data => {
  $('version').textContent = data.version;
  const voice = data.voice || {};
  if (!voice.available) {
    $('record').disabled = true;
    $('record').title = voice.reason || '语音不可用';
    document.querySelector('.headline .muted').textContent = '数据分析入门 · 网页文字';
    status(voice.reason ? `语音不可用：${voice.reason}` : '语音不可用，仅文字');
  } else {
    $('record').title = `按住说话：${voice.asr_model} → ${voice.tts_model}`;
    status(!data.configured ? '未配置模型：请先在本机运行 configure-model'
      : data.scripted ? '脚本模式 · 模拟写入 · 语音走服务端' : 'Coding Plan · 模拟写入 · 语音走服务端');
  }
}).catch(() => status('服务状态暂不可用，请稍后刷新页面'));
</script>
</body>
</html>
